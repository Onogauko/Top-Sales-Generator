<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Sales Generator - Jenta Zebua</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
body { font-family: 'Segoe UI'; background:#f1f5f9; transition: zoom 0.2s ease; }
.excel-table { border-collapse: collapse; border:2px solid black; font-size:11px; background:white; width: 100%; }
.excel-table th, .excel-table td { border:1px solid #444; padding:3px 6px; }
.rank-1 { background:#00b050; }
.rank-2 { background:#ffff00; }
.rank-3 { background:#f8cbad; }
.num-cell { text-align:right; font-family: monospace; }
.text-center { text-align: center; }
.admin-locked { display: none; }
</style>
</head>

<body class="p-6">

<div class="mb-6 border-b-2 border-gray-300 pb-2 flex justify-between items-center">
    <div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">TOP SALES GENERATOR</h1>
        <p class="text-xs text-slate-500 uppercase font-bold tracking-widest">Retail Data Analysis System</p>
    </div>
    <div id="adminLoginArea">
        <input type="password" id="adminPass" placeholder="Password Admin" class="border p-1 text-sm rounded">
        <button onclick="checkAdmin()" class="bg-slate-800 text-white px-3 py-1 rounded text-sm font-bold">Login Admin</button>
    </div>
    <button id="logoutBtn" onclick="logoutAdmin()" class="hidden bg-red-600 text-white px-3 py-1 rounded text-sm font-bold">Logout Admin</button>
</div>

<!-- PANEL PENGATURAN ADMIN -->
<div id="adminPanel" class="admin-locked mb-6 bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
    <h2 class="font-bold text-lg mb-4 flex items-center">⚙️ Control Panel - Management Divisi</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gray-50 p-4 rounded border">
            <h3 class="font-bold text-sm mb-3">Tambah / Edit Divisi</h3>
            <input type="text" id="newDivName" placeholder="Nama Divisi" class="w-full mb-2 p-2 border rounded text-sm uppercase">
            <textarea id="newDivCodes" placeholder="Masukkan Kode Dept (pisahkan dengan koma)" class="w-full mb-2 p-2 border rounded text-sm h-20"></textarea>
            <button onclick="addOrUpdateDivision()" class="save-btn w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 disabled:opacity-50">Simpan Divisi</button>
        </div>

        <div class="bg-gray-50 p-4 rounded border">
            <h3 class="font-bold text-sm mb-3">Daftar Divisi Saat Ini</h3>
            <div id="divisionListDisplay" class="text-xs space-y-2 max-h-40 overflow-y-auto"></div>
        </div>

        <div class="bg-gray-50 p-4 rounded border">
            <h3 class="font-bold text-sm mb-1">Kolom Store</h3>
            <p class="text-[10px] text-slate-500 mb-2">Satu baris per store: <code>KOLOM = Nama Store</code>. Nama boleh kosong (pakai header CSV). Contoh: <code>M = AEON BSD</code></p>
            <textarea id="storeConfigInput" class="w-full mb-2 p-2 border rounded text-xs font-mono h-28"></textarea>
            <button onclick="saveStores()" class="save-btn w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 disabled:opacity-50">Simpan Store</button>
        </div>
    </div>

    <p id="saveStatus" class="mt-3 text-xs font-bold"></p>
</div>

<p id="configStatus" class="mb-4 text-xs text-slate-500">Memuat konfigurasi...</p>

<div class="flex flex-wrap gap-4 items-end mb-4">
    <div>
        <label class="block text-sm font-bold mb-1 text-slate-700">Pilih File CSV:</label>
        <input type="file" onchange="handleFileUpload(event)" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
    </div>

    <div>
        <label class="block text-sm font-bold mb-1 text-slate-700">Tampilkan Rank:</label>
        <select id="rankLimit" onchange="generate()" class="border border-gray-300 rounded px-3 py-2 text-sm">
            <option value="10">Top 10 SKU</option>
            <option value="15">Top 15 SKU</option>
            <option value="20">Top 20 SKU</option>
            <option value="50">Top 50 SKU</option>
        </select>
    </div>

    <div class="flex gap-2">
        <button onclick="changeZoom(0.1)" class="bg-gray-700 text-white px-3 py-2 rounded font-bold text-sm">Zoom In (+)</button>
        <button onclick="changeZoom(-0.1)" class="bg-gray-700 text-white px-3 py-2 rounded font-bold text-sm">Zoom Out (-)</button>
        <button onclick="resetZoom()" class="bg-gray-400 text-white px-4 py-2 rounded text-sm">Reset</button>
        <span id="zoomLabel" class="self-center font-mono text-sm ml-2">100%</span>
    </div>

    <button onclick="exportExcel()" class="bg-green-600 text-white px-6 py-2 rounded font-bold ml-auto shadow-md hover:bg-green-700">
        Export Excel (1 Sheet)
    </button>
</div>

<hr class="mb-4">
<div id="report"></div>

<script>
let rawData=[], headers=[];
let currentZoom = 1.0;
// Konfigurasi dimuat dari server (Code.gs, Script Properties) saat halaman dibuka.
let config = { divisions: {}, stores: [] };
let divisionMapping = config.divisions;
// Password hanya disimpan di memori selama login, dikirim ke server untuk setiap simpan.
let adminPassword = null;

function hasServer() {
    return typeof google !== 'undefined' && google.script && google.script.run;
}

function callServer(fn, ...args) {
    return new Promise((resolve, reject) => {
        if(!hasServer()) return reject(new Error("Halaman harus dibuka lewat URL Web App Google Apps Script."));
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
}

function applyConfig(newConfig) {
    config = newConfig;
    divisionMapping = config.divisions;
    if(adminPassword) renderAdminPanel();
    if(rawData.length > 0) generate();
}

function loadConfig() {
    const status = document.getElementById('configStatus');
    callServer('getConfig')
        .then(c => {
            applyConfig(c);
            status.textContent = `Konfigurasi: ${Object.keys(c.divisions).length} divisi, ${c.stores.length} store.`;
        })
        .catch(err => {
            status.textContent = "Gagal memuat konfigurasi: " + err.message;
            status.className = "mb-4 text-xs font-bold text-red-600";
        });
}

function checkAdmin() {
    const input = document.getElementById('adminPass').value;
    callServer('checkAdmin', input)
        .then(ok => {
            if(!ok) return alert("Password Salah!");
            adminPassword = input;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            renderAdminPanel();
        })
        .catch(err => alert(err.message));
}

function logoutAdmin() {
    adminPassword = null;
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('adminLoginArea').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
    document.getElementById('adminPass').value = "";
}

function renderAdminPanel() {
    renderDivisionList();
    document.getElementById('storeConfigInput').value =
        config.stores.map(s => s.name ? `${s.col} = ${s.name}` : s.col).join('\n');
}

function renderDivisionList() {
    const list = document.getElementById('divisionListDisplay');
    list.innerHTML = "";
    Object.keys(divisionMapping).forEach(div => {
        const divEl = document.createElement('div');
        divEl.className = "flex justify-between items-center bg-white p-2 border rounded mb-1";
        divEl.innerHTML = `<span><strong></strong> (${divisionMapping[div].length} Dept)</span><div><button class="text-blue-600 mr-2 text-[10px]">Edit</button><button class="text-red-600 text-[10px]">Hapus</button></div>`;
        divEl.querySelector('strong').textContent = div;
        const [editBtn, delBtn] = divEl.querySelectorAll('button');
        editBtn.addEventListener('click', () => editDiv(div));
        delBtn.addEventListener('click', () => deleteDiv(div));
        list.appendChild(divEl);
    });
}

// Simpan ke server; tampilan baru diperbarui setelah server mengonfirmasi.
function saveConfig(newConfig) {
    const status = document.getElementById('saveStatus');
    const buttons = document.querySelectorAll('#adminPanel .save-btn');
    buttons.forEach(b => b.disabled = true);
    status.textContent = "Menyimpan...";
    status.className = "mt-3 text-xs font-bold text-slate-500";
    return callServer('saveConfig', adminPassword, newConfig)
        .then(saved => {
            applyConfig(saved);
            status.textContent = "✓ Tersimpan & langsung berlaku untuk semua user.";
            status.className = "mt-3 text-xs font-bold text-green-700";
            return true;
        })
        .catch(err => {
            status.textContent = "Gagal menyimpan: " + err.message;
            status.className = "mt-3 text-xs font-bold text-red-600";
            return false;
        })
        .finally(() => buttons.forEach(b => b.disabled = false));
}

function addOrUpdateDivision() {
    const nameInput = document.getElementById('newDivName');
    const codesInput = document.getElementById('newDivCodes');
    const name = nameInput.value.trim().toUpperCase();
    const codesRaw = codesInput.value;
    const codes = codesRaw.split(',').map(c => c.trim()).filter(c => c !== "");
    if(!name || codes.length === 0) return alert("Isi Nama Divisi dan Kode Dept!");
    const bad = codes.filter(c => !/^\d+$/.test(c));
    if(bad.length) return alert("Kode Dept harus angka: " + bad.join(', '));
    const divisions = { ...divisionMapping, [name]: codes };
    saveConfig({ ...config, divisions }).then(ok => {
        if(!ok) return;
        nameInput.value = "";
        codesInput.value = "";
    });
}

function editDiv(name) {
    document.getElementById('newDivName').value = name;
    document.getElementById('newDivCodes').value = divisionMapping[name].join(', ');
}

function deleteDiv(name) {
    if(!confirm(`Hapus divisi ${name}?`)) return;
    const divisions = { ...divisionMapping };
    delete divisions[name];
    saveConfig({ ...config, divisions });
}

function saveStores() {
    const lines = document.getElementById('storeConfigInput').value.split('\n').map(l => l.trim()).filter(Boolean);
    const stores = [];
    for(const line of lines) {
        const [colPart, ...nameParts] = line.split('=');
        const col = colPart.trim().toUpperCase();
        if(!/^[A-Z]{1,3}$/.test(col)) return alert(`Kolom tidak valid: "${line}"`);
        if(stores.some(s => s.col === col)) return alert(`Kolom ${col} dobel.`);
        stores.push({ col, name: nameParts.join('=').trim() });
    }
    if(!stores.length) return alert("Minimal harus ada 1 kolom store!");
    saveConfig({ ...config, stores });
}

function storeCols() {
    return config.stores.map(s => letterToIdx(s.col));
}

function storeLabel(k) {
    const s = config.stores[k];
    return s.name || headers[letterToIdx(s.col)] || s.col;
}

function changeZoom(amount) {
    currentZoom += amount;
    if (currentZoom < 0.5) currentZoom = 0.5;
    if (currentZoom > 2.0) currentZoom = 2.0;
    document.body.style.zoom = currentZoom;
    document.getElementById('zoomLabel').innerText = Math.round(currentZoom * 100) + "%";
}

function resetZoom() {
    currentZoom = 1.0;
    document.body.style.zoom = 1.0;
    document.getElementById('zoomLabel').innerText = "100%";
}

function letterToIdx(l){
    let r=0;
    for(let i=0;i<l.length;i++) r=r*26+(l.charCodeAt(i)-64);
    return r-1;
}

function cleanNum(val){
    if(val===null||val===undefined) return 0;
    let str=String(val).trim();
    if(str===''||str==='-') return 0;
    if(/^\d{1,3}(\.\d{3})+$/.test(str)) str=str.replace(/\./g,'');
    else if(/^\d{1,3}(\.\d{3})+,\d+$/.test(str)) str=str.replace(/\./g,'').replace(',', '.');
    else if(/^\d{1,3}(,\d{3})+$/.test(str)) str=str.replace(/,/g,'');
    else if(/^\d{1,3}(,\d{3})+\.\d+$/.test(str)) str=str.replace(/,/g,'');
    let num=Number(str);
    return isNaN(num)?0:num;
}

function handleFileUpload(e){
    Papa.parse(e.target.files[0],{
        skipEmptyLines:true,
        complete:function(res){
            headers=res.data[0];
            rawData=res.data.slice(1);
            generate();
        }
    });
}

function generate(){
    if(!rawData.length) return;
    const limit = parseInt(document.getElementById('rankLimit').value);
    const amountIdx=storeCols();
    let html="";
    
    Object.keys(divisionMapping).forEach(div=>{
        let rows = rawData.filter(r=>{
            const codes = String(r[3]||'').match(/\d+/g)||[];
            return codes.some(c => divisionMapping[div].includes(c));
        });
        if(!rows.length) return;
        
        const map = new Map();
        rows.forEach(r=>{
            let rawSku=String(r[5]||'').trim();
            if(!rawSku || rawSku.toUpperCase().includes('TOTAL')) return;
            let sku=rawSku.replace(/^0+/,'');
            if(!map.has(sku)){
                let obj={sku,displaySku:rawSku,desc:r[6],totalAll:0,stores:{}};
                amountIdx.forEach(i=>obj.stores[i]=0);
                map.set(sku,obj);
            }
            let item=map.get(sku);
            amountIdx.forEach(i=>{
                let v=cleanNum(r[i]);
                item.stores[i]+=v;
                item.totalAll+=v;
            });
        });

        let allItems = [...map.values()];
        let topItems = [...allItems].sort((a,b)=>b.totalAll-a.totalAll).slice(0,limit);
        
        let storeRankings = {};
        amountIdx.forEach(i => {
            storeRankings[i] = new Map(
                [...allItems]
                .sort((a,b) => b.stores[i] - a.stores[i])
                .map((it, idx) => [it.sku, idx + 1])
            );
        });
        
        html+=`<h2 class="font-bold text-lg text-slate-800 mt-6 mb-2 uppercase">DIVISION: ${div}</h2><table class="excel-table"><tr><th class="text-center">Rank</th><th>SKU</th><th>Item Description</th><th>Total All Store</th>`;
        amountIdx.forEach((i,k)=>html+=`<th>${storeLabel(k)}</th>`);
        html+="</tr>";
        
        topItems.forEach((it,idx)=>{
            let rClass = idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'';
            html+=`<tr><td class="${rClass} font-bold text-center">${idx+1}</td><td>${it.displaySku}</td><td>${it.desc}</td><td class="num-cell ${rClass}">${it.totalAll.toLocaleString('id-ID')}</td>`;
            
            amountIdx.forEach(i=>{
                let val=it.stores[i];
                let rank = storeRankings[i].get(it.sku) || 999;
                let sClass = rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
                html+=`<td class="num-cell ${sClass}">${val?val.toLocaleString('id-ID'):'-'}</td>`;
            });
            html+="</tr>";
        });
        html+="</table>";
    });
    document.getElementById('report').innerHTML=html;
}

function exportExcel(){

    if(!rawData.length) return alert("Pilih file terlebih dahulu!");

    const limit = parseInt(document.getElementById('rankLimit').value);

    const amountIdx = storeCols();

    let wb = XLSX.utils.book_new();

    let ws_data = [];

    Object.keys(divisionMapping).forEach(div=>{

        let rows = rawData.filter(r=>{
            const codes = String(r[3]||'').match(/\d+/g)||[];
            return codes.some(c => divisionMapping[div].includes(c));
        });

        if(!rows.length) return;

        // TITLE
        ws_data.push([`DIVISION: ${div}`]);

        // SPASI
        ws_data.push([]);

        // HEADER
        let header = [
            "Rank",
            "SKU",
            "Item Description",
            "Total All Store"
        ];

        amountIdx.forEach((i,k)=>{
            header.push(storeLabel(k));
        });

        ws_data.push(header);

        const map = new Map();

        rows.forEach(r=>{

            let rawSku = String(r[5]||'').trim();

            if(!rawSku || rawSku.toUpperCase().includes('TOTAL')) return;

            let sku = rawSku.replace(/^0+/,'');

            if(!map.has(sku)){

                let obj = {
                    sku,
                    displaySku:rawSku,
                    desc:r[6],
                    totalAll:0,
                    stores:{}
                };

                amountIdx.forEach(i=>{
                    obj.stores[i] = 0;
                });

                map.set(sku,obj);
            }

            let item = map.get(sku);

            amountIdx.forEach(i=>{

                let v = cleanNum(r[i]);

                item.stores[i] += v;

                item.totalAll += v;
            });
        });

        let topItems = [...map.values()]
            .sort((a,b)=>b.totalAll-a.totalAll)
            .slice(0,limit);

// STORE RANKING
let storeRankings = {};

amountIdx.forEach(i => {

    storeRankings[i] = new Map(
        [...map.values()]
        .sort((a,b)=>b.stores[i]-a.stores[i])
        .map((it, idx)=>[it.sku, idx+1])
    );

});

        topItems.forEach((it,idx)=>{

let row = [
    idx+1,
    "'" + it.displaySku,
    it.desc,
    it.totalAll
];

row._storeRanks = {};

amountIdx.forEach(i=>{

    row.push(it.stores[i]);

    row._storeRanks[i] =
        storeRankings[i].get(it.sku);

});

            ws_data.push(row);
        });

        ws_data.push([]);
        ws_data.push([]);
    });

    let ws = XLSX.utils.aoa_to_sheet(ws_data);

    // AUTO WIDTH: Rank, SKU, Desc, Total, lalu 1 kolom per store
    ws['!cols'] = [{wch:8},{wch:15},{wch:45},{wch:18}, ...amountIdx.map(()=>({wch:15}))];

    const range = XLSX.utils.decode_range(ws['!ref']);

    for(let R = range.s.r; R <= range.e.r; ++R){

        for(let C = range.s.c; C <= range.e.c; ++C){

            let cellAddress = XLSX.utils.encode_cell({r:R,c:C});

            if(!ws[cellAddress]) continue;

            let cell = ws[cellAddress];

            // BORDER SEMUA
            cell.s = {
                border:{
                    top:{style:"thin", color:{rgb:"444444"}},
                    bottom:{style:"thin", color:{rgb:"444444"}},
                    left:{style:"thin", color:{rgb:"444444"}},
                    right:{style:"thin", color:{rgb:"444444"}}
                },
                font:{
                    name:"Segoe UI",
                    sz:10
                },
                alignment:{
                    vertical:"center",
                    horizontal: C >= 3 ? "right" : "left"
                }
            };

            // HEADER
            if(R > 0 && ws[XLSX.utils.encode_cell({r:R,c:0})]?.v === "Rank"){

                cell.s.fill = {
                    fgColor:{rgb:"1E293B"}
                };

                cell.s.font = {
                    bold:true,
                    color:{rgb:"FFFFFF"}
                };

                cell.s.alignment = {
                    horizontal:"center",
                    vertical:"center"
                };
            }

            // TITLE DIVISION
            if(C === 0 && String(cell.v).includes("DIVISION:")){

                cell.s.font = {
                    bold:true,
                    sz:14,
                    color:{rgb:"1E293B"}
                };

                cell.s.border = {};
            }

            // RANK COLOR
            if(C === 0 && typeof cell.v === "number"){

                if(cell.v === 1){

                    cell.s.fill = {
                        fgColor:{rgb:"00B050"}
                    };

                    cell.s.font.bold = true;
                }

                if(cell.v === 2){

                    cell.s.fill = {
                        fgColor:{rgb:"FFFF00"}
                    };

                    cell.s.font.bold = true;
                }

                if(cell.v === 3){

                    cell.s.fill = {
                        fgColor:{rgb:"F8CBAD"}
                    };

                    cell.s.font.bold = true;
                }

                cell.s.alignment.horizontal = "center";
            }

// TOTAL ALL STORE COLOR
if(C === 3 && typeof cell.v === "number"){

    let rankCell =
        ws[XLSX.utils.encode_cell({r:R,c:0})];

    let rank = rankCell?.v;

    if(rank === 1){

        cell.s.fill = {
            fgColor:{rgb:"00B050"}
        };

        cell.s.font.bold = true;
    }

    if(rank === 2){

        cell.s.fill = {
            fgColor:{rgb:"FFFF00"}
        };

        cell.s.font.bold = true;
    }

    if(rank === 3){

        cell.s.fill = {
            fgColor:{rgb:"F8CBAD"}
        };

        cell.s.font.bold = true;
    }
}

            // FORMAT ANGKA
if(C >= 3 && typeof cell.v === "number"){

    cell.z = '#,##0';

    // STORE COLUMN
    if(C >= 4){

        let dataRow = ws_data[R];

        if(dataRow){

            let storeIdx = amountIdx[C - 4];

            let rank =
                dataRow._storeRanks?.[storeIdx];

            if(rank === 1){

                cell.s.fill = {
                    fgColor:{rgb:"00B050"}
                };

                cell.s.font.bold = true;
            }

            if(rank === 2){

                cell.s.fill = {
                    fgColor:{rgb:"FFFF00"}
                };

                cell.s.font.bold = true;
            }

            if(rank === 3){

                cell.s.fill = {
                    fgColor:{rgb:"F8CBAD"}
                };

                cell.s.font.bold = true;
            }
        }
    }
}
        }
    }

    XLSX.utils.book_append_sheet(wb, ws, "Top Sales");

    XLSX.writeFile(wb, "Top_Sales_Report.xlsx");
}

loadConfig();
</script>
</body>
</html>
